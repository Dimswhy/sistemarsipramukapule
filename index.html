<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Arsip Digital - RSIA IBI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .modal-active { display: flex !important; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            
            .print-container { 
                width: 210mm !important;
                margin: 0 auto !important;
                padding: 10mm !important;
                border: none !important;
                display: block !important;
            }
            
            #detail-modal {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                display: block !important;
                background: white !important;
            }

            .modal-content-wrapper {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
            }

            @page { size: A4; margin: 0; }
        }

        .disposisi-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid black;
        }
        .disposisi-table td {
            border: 1px solid black;
            padding: 10px;
            vertical-align: top;
            color: black;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app" class="min-h-screen flex flex-col md:flex-row no-print">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-slate-900 text-white flex-shrink-0 shadow-xl z-20">
            <div class="p-8">
                <h1 class="text-2xl font-bold flex items-center gap-3">
                    <div class="p-2 bg-blue-600 rounded-lg">
                        <i data-lucide="archive" class="w-6 h-6 text-white"></i>
                    </div>
                    <span>ArsipKita</span>
                </h1>
                <p class="text-[10px] text-slate-400 mt-2 uppercase tracking-[0.2em] font-semibold">RSIA IBI SURABAYA</p>
            </div>
            <nav class="mt-4 px-4 space-y-2">
                <button onclick="switchTab('dashboard')" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-all" data-tab="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> <span class="font-medium">Dashboard</span>
                </button>
                <div class="pt-4 pb-2 px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Manajemen Surat</div>
                <button onclick="switchTab('surat-masuk')" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 transition-all" data-tab="surat-masuk">
                    <i data-lucide="mail" class="w-5 h-5"></i> <span>Surat Masuk</span>
                </button>
                <button onclick="switchTab('surat-keluar')" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 transition-all" data-tab="surat-keluar">
                    <i data-lucide="send" class="w-5 h-5"></i> <span>Surat Keluar</span>
                </button>
                <div class="pt-4 pb-2 px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Dokumentasi</div>
                <button onclick="switchTab('sk')" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 transition-all" data-tab="sk">
                    <i data-lucide="file-check" class="w-5 h-5"></i> <span>Surat Keputusan</span>
                </button>
                <button onclick="switchTab('notulen')" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 transition-all" data-tab="notulen">
                    <i data-lucide="clipboard-list" class="w-5 h-5"></i> <span>Notulen Rapat</span>
                </button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col min-w-0">
            <header class="h-20 bg-white border-b flex items-center justify-between px-8 sticky top-0 z-10 shadow-sm">
                <div>
                    <h2 id="page-title" class="text-xl font-bold text-slate-800">Dashboard</h2>
                    <p id="current-date" class="text-xs text-slate-500 font-medium"></p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="hidden md:flex flex-col text-right">
                        <span class="text-sm font-bold text-slate-700">Administrator</span>
                        <span class="text-[10px] text-green-500 font-bold uppercase">Online</span>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">AD</div>
                </div>
            </header>

            <div id="content-area" class="p-8 overflow-y-auto w-full">
                <!-- Dashboard Section -->
                <div id="section-dashboard" class="section">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8" id="stats-container"></div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="p-6 border-b"><h3 class="font-bold text-slate-800">Aktivitas Terbaru</h3></div>
                        <div class="overflow-x-auto"><table class="w-full text-left"><tbody id="dashboard-recent-body"></tbody></table></div>
                    </div>
                </div>

                <!-- Table Section -->
                <div id="section-table" class="section hidden">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                        <div class="relative w-full md:w-96">
                            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                            <input type="text" id="table-search" onkeyup="filterTable()" class="block w-full pl-10 pr-4 py-2 bg-white border rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cari data...">
                        </div>
                        <button onclick="openModal()" class="w-full md:w-auto bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-700 transition-all">
                            <i data-lucide="plus" class="w-5 h-5"></i> Tambah Data
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-slate-100">
                                <thead class="bg-slate-50" id="table-headers"></thead>
                                <tbody id="table-body" class="divide-y"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Detail & Print -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-0 md:p-4 overflow-y-auto">
        <div class="bg-white rounded-none md:rounded-3xl w-full max-w-[210mm] shadow-2xl flex flex-col modal-content-wrapper min-h-screen md:min-h-0">
            <div class="px-8 py-4 border-b bg-white flex justify-between items-center sticky top-0 z-10 no-print">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="printer" class="w-5 h-5"></i></div>
                    <h3 class="text-lg font-bold text-slate-800">Pratinjau Dokumen</h3>
                </div>
                <div class="flex gap-2">
                    <button id="btn-print" onclick="window.print()" class="bg-slate-900 text-white px-5 py-2 rounded-xl flex items-center gap-2 font-bold text-sm hover:bg-black transition-all">
                        <i data-lucide="printer" class="w-4 h-4"></i> Cetak
                    </button>
                    <button onclick="closeDetailModal()" class="p-2 hover:bg-slate-100 rounded-full transition-all">
                        <i data-lucide="x" class="w-6 h-6 text-slate-400"></i>
                    </button>
                </div>
            </div>
            
            <div id="detail-content" class="bg-white print-container"></div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="form-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-3xl w-full max-w-xl shadow-2xl overflow-hidden flex flex-col">
            <div class="px-8 py-6 border-b flex justify-between items-center bg-slate-50">
                <h3 class="text-xl font-bold text-slate-800" id="modal-title">Form Data</h3>
                <button onclick="closeModal()" class="p-2 hover:bg-white rounded-full"><i data-lucide="x" class="w-6 h-6 text-slate-400"></i></button>
            </div>
            <div class="p-8 overflow-y-auto max-h-[70vh]">
                <form id="doc-form" class="space-y-4">
                    <input type="hidden" id="form-edit-index">
                    <div id="dynamic-form-fields" class="space-y-4"></div>
                    <!-- Upload File Section -->
                    <div class="pt-4 border-t">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1 tracking-wider">Lampiran Dokumen (Image/PDF)</label>
                        <input type="file" id="file-upload" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" accept="image/*,application/pdf">
                        <p class="text-[10px] text-slate-400 mt-1">*Maks 2MB (disimpan di browser)</p>
                    </div>
                </form>
            </div>
            <div class="px-8 py-6 border-t bg-slate-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-6 py-2 text-slate-600 font-bold">Batal</button>
                <button onclick="handleSave()" id="btn-save" class="px-8 py-2 bg-blue-600 text-white rounded-xl font-bold flex items-center gap-2">
                    <span>Simpan Data</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'dashboard';
        let archiveData = JSON.parse(localStorage.getItem('archiveData_rsia_final')) || {
            'surat-masuk': [], 'surat-keluar': [], 'sk': [], 'notulen': []
        };

        const config = {
            'surat-masuk': {
                title: 'Surat Masuk', color: 'blue', icon: 'mail',
                headers: ['Agenda', 'No. Surat', 'Asal Surat', 'Perihal', 'Aksi'],
                fields: [
                    { name: 'no_agenda', label: 'Nomor Agenda', type: 'text' },
                    { name: 'tgl_terima', label: 'Tanggal Diterima', type: 'date' },
                    { name: 'terima_dari', label: 'Diterima Dari (Asal)', type: 'text' },
                    { name: 'no_surat', label: 'Nomor Surat', type: 'text' },
                    { name: 'tgl_surat', label: 'Tanggal Surat', type: 'date' },
                    { name: 'perihal', label: 'Perihal', type: 'text' },
                    { name: 'ditujukan', label: 'Diteruskan Kepada', type: 'text' },
                    { name: 'disposisi', label: 'Instruksi Disposisi', type: 'textarea' }
                ]
            },
            'surat-keluar': {
                title: 'Surat Keluar', color: 'emerald', icon: 'send',
                headers: ['Tgl Surat', 'No. Surat', 'Tujuan', 'Perihal', 'Aksi'],
                fields: [
                    { name: 'tgl_surat', label: 'Tanggal Surat', type: 'date' },
                    { name: 'no_surat', label: 'Nomor Surat', type: 'text' },
                    { name: 'kepada', label: 'Tujuan', type: 'text' },
                    { name: 'perihal', label: 'Perihal', type: 'text' }
                ]
            },
            'sk': {
                title: 'Surat Keputusan', color: 'purple', icon: 'file-check',
                headers: ['No. SK', 'Tentang', 'Tanggal', 'Aksi'],
                fields: [
                    { name: 'no_sk', label: 'Nomor SK', type: 'text' },
                    { name: 'tentang', label: 'Tentang', type: 'text' },
                    { name: 'tanggal', label: 'Tanggal SK', type: 'date' }
                ]
            },
            'notulen': {
                title: 'Notulen Rapat', color: 'amber', icon: 'clipboard-list',
                headers: ['Agenda', 'Tanggal', 'Pimpinan', 'Aksi'],
                fields: [
                    { name: 'agenda', label: 'Agenda Rapat', type: 'text' },
                    { name: 'tanggal', label: 'Tanggal Rapat', type: 'date' },
                    { name: 'pimpinan', label: 'Pimpinan Rapat', type: 'text' },
                    { name: 'hasil', label: 'Hasil Ringkasan', type: 'textarea' }
                ]
            }
        };

        function init() {
            lucide.createIcons();
            document.getElementById('current-date').innerText = new Intl.DateTimeFormat('id-ID', { dateStyle: 'full' }).format(new Date());
            switchTab('dashboard');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.nav-link').forEach(el => {
                const isActive = el.dataset.tab === tabId;
                el.classList.toggle('bg-blue-600', isActive);
                el.classList.toggle('text-white', isActive);
                el.classList.toggle('text-slate-400', !isActive);
            });
            renderTab();
        }

        function renderTab() {
            const isDashboard = currentTab === 'dashboard';
            document.getElementById('section-dashboard').classList.toggle('hidden', !isDashboard);
            document.getElementById('section-table').classList.toggle('hidden', isDashboard);
            if (isDashboard) renderDashboard(); else renderTable();
            lucide.createIcons();
        }

        function renderDashboard() {
            document.getElementById('page-title').innerText = 'Dashboard';
            const stats = [['surat-masuk', 'blue'], ['surat-keluar', 'emerald'], ['sk', 'purple'], ['notulen', 'amber']];
            document.getElementById('stats-container').innerHTML = stats.map(([key, col]) => `
                <div class="bg-white p-6 rounded-2xl border border-slate-100 flex items-center gap-5 cursor-pointer hover:shadow-md transition-all" onclick="switchTab('${key}')">
                    <div class="text-${col}-600 bg-${col}-50 w-14 h-14 rounded-2xl flex items-center justify-center">
                        <i data-lucide="${config[key].icon}" class="w-7 h-7"></i>
                    </div>
                    <div>
                        <h3 class="text-slate-500 text-xs font-bold uppercase tracking-wider">${config[key].title}</h3>
                        <p class="text-3xl font-extrabold text-slate-800">${archiveData[key].length}</p>
                    </div>
                </div>`).join('');

            const recentBody = document.getElementById('dashboard-recent-body');
            recentBody.innerHTML = '';
            let all = [];
            Object.keys(archiveData).forEach(cat => archiveData[cat].forEach((item, idx) => all.push({...item, _cat: cat, _idx: idx})));
            all.sort((a,b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
            
            if (all.length === 0) {
                recentBody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-slate-400 italic">Belum ada aktivitas data</td></tr>';
            } else {
                all.slice(0, 5).forEach(item => {
                    recentBody.innerHTML += `
                        <tr class="hover:bg-slate-50 border-b border-slate-50">
                            <td class="px-6 py-4 font-bold text-sm text-slate-700">${item.perihal || item.tentang || item.agenda}</td>
                            <td class="px-6 py-4"><span class="text-[10px] font-bold px-2 py-1 rounded bg-${config[item._cat].color}-50 text-${config[item._cat].color}-600 uppercase">${config[item._cat].title}</span></td>
                            <td class="px-6 py-4 text-xs text-slate-500">${item.tgl_terima || item.tgl_surat || item.tanggal}</td>
                            <td class="px-6 py-4">
                                <button onclick="viewDetailFromGlobal('${item._cat}', ${item._idx})" class="text-blue-600 font-bold text-xs hover:underline">Lihat</button>
                            </td>
                        </tr>`;
                });
            }
        }

        function renderTable() {
            document.getElementById('page-title').innerText = config[currentTab].title;
            const head = document.getElementById('table-headers');
            head.innerHTML = `<tr class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${config[currentTab].headers.map(h => `<th class="px-6 py-4">${h}</th>`).join('')}</tr>`;
            
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            if (archiveData[currentTab].length === 0) {
                body.innerHTML = `<tr><td colspan="${config[currentTab].headers.length}" class="p-12 text-center text-slate-400 italic">Tidak ada data di kategori ini</td></tr>`;
                return;
            }

            archiveData[currentTab].forEach((item, idx) => {
                let row = '';
                if (currentTab === 'surat-masuk') row = `<td>#${item.no_agenda}</td><td>${item.no_surat}</td><td>${item.terima_dari}</td><td>${item.perihal}</td>`;
                else if (currentTab === 'surat-keluar') row = `<td>${item.tgl_surat}</td><td>${item.no_surat}</td><td>${item.kepada}</td><td>${item.perihal}</td>`;
                else if (currentTab === 'sk') row = `<td>${item.no_sk}</td><td>${item.tentang}</td><td>${item.tanggal}</td>`;
                else if (currentTab === 'notulen') row = `<td>${item.agenda}</td><td>${item.tanggal}</td><td>${item.pimpinan}</td>`;

                body.innerHTML += `<tr class="hover:bg-slate-50 transition-colors">
                    ${row.split('</td>').map(c => c ? `<td class="px-6 py-4 text-sm text-slate-600">${c.replace('<td>','')}</td>` : '').join('')}
                    <td class="px-6 py-4 flex gap-2">
                        <button onclick="viewDetail(${idx})" class="p-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100" title="Lihat"><i data-lucide="eye" class="w-4 h-4"></i></button>
                        <button onclick="editData(${idx})" class="p-1.5 bg-amber-50 text-amber-600 rounded-lg hover:bg-amber-100" title="Edit"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="deleteData(${idx})" class="p-1.5 bg-red-50 text-red-500 rounded-lg hover:bg-red-100" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`;
            });
            lucide.createIcons();
        }

        function viewDetail(idx) {
            const item = archiveData[currentTab][idx];
            const content = document.getElementById('detail-content');
            
            if (currentTab === 'surat-masuk') {
                content.innerHTML = `
                    <div class="border-[3px] border-black p-4 md:p-8 bg-white text-black font-serif">
                        <!-- KOP SURAT ASLI RSIA IBI (MODIFIKASI LOGO) -->
                        <div class="flex items-center border-b-[4px] border-black pb-4 mb-6">
                            <div class="w-24 h-24 flex-shrink-0 flex items-center justify-center">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Logo_Ikatan_Bidan_Indonesia.png" class="max-w-full max-h-full object-contain" alt="Logo IBI">
                            </div>
                            <div class="flex-1 text-center px-4">
                                <h2 class="text-sm font-bold uppercase">Ikatan Bidan Indonesia (IBI)</h2>
                                <h1 class="text-2xl md:text-3xl font-black uppercase leading-tight mt-1">RSIA IBI SURABAYA</h1>
                                <p class="text-xs font-semibold">Jl. Dupak No. 15-17, Surabaya, Jawa Timur</p>
                                <p class="text-[10px]">Telp: (031) 3522234 | Fax: (031) 3522235</p>
                            </div>
                            <div class="w-24 h-24 flex-shrink-0 flex items-center justify-center">
                                <img src="https://upload.wikimedia.org/wikipedia/id/8/8c/Logo_KARS.png" class="max-w-full max-h-full object-contain" alt="Logo Akreditasi">
                            </div>
                        </div>

                        <h3 class="text-center font-black text-2xl underline mb-6 uppercase">Lembar Disposisi</h3>
                        
                        <table class="disposisi-table">
                            <tr>
                                <td width="30%"><strong>No. Agenda:</strong><br><span class="text-xl font-black">#${item.no_agenda || '-'}</span></td>
                                <td width="30%"><strong>Tgl. Terima:</strong><br>${item.tgl_terima || '-'}</td>
                                <td width="40%" class="text-[10px] leading-tight italic">
                                    Segera proses instruksi di bawah ini dan kembalikan ke sekretariat.
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Asal Surat:</strong></td>
                                <td colspan="2" class="uppercase font-bold">${item.terima_dari || '-'}</td>
                            </tr>
                            <tr>
                                <td><strong>No. Surat:</strong></td>
                                <td colspan="2">${item.no_surat || '-'} <span class="ml-4 italic">(Tgl: ${item.tgl_surat || '-'})</span></td>
                            </tr>
                            <tr>
                                <td colspan="3" class="bg-slate-50">
                                    <p class="text-[9px] font-bold uppercase mb-1">Perihal:</p>
                                    <p class="text-sm font-bold italic">${item.perihal || '-'}</p>
                                </td>
                            </tr>
                            <tr>
                                <td class="min-h-[300px]">
                                    <p class="text-[10px] font-bold uppercase underline mb-4">Diteruskan Kepada:</p>
                                    <div class="space-y-3 text-[11px] uppercase font-bold">
                                        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 border border-black ${item.ditujukan?.toLowerCase().includes('direktur') ? 'bg-black' : ''}"></div> Direktur</div>
                                        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 border border-black ${item.ditujukan?.toLowerCase().includes('umum') ? 'bg-black' : ''}"></div> Kasubag Umum</div>
                                        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 border border-black ${item.ditujukan?.toLowerCase().includes('medis') ? 'bg-black' : ''}"></div> Yan Medis</div>
                                        <div class="flex items-center gap-2"><div class="w-3.5 h-3.5 border border-black ${item.ditujukan?.toLowerCase().includes('keuangan') ? 'bg-black' : ''}"></div> Keuangan</div>
                                        <div class="mt-6 pt-2 border-t border-dotted border-black text-[9px] normal-case font-normal italic">Ket: ${item.ditujukan || '-'}</div>
                                    </div>
                                </td>
                                <td colspan="2" class="p-6">
                                    <p class="text-[10px] font-bold uppercase underline mb-3">Instruksi / Disposisi:</p>
                                    <div class="italic font-serif leading-relaxed text-base min-h-[200px]">
                                        ${item.disposisi || ''}
                                    </div>
                                    <div class="mt-12 flex justify-end">
                                        <div class="w-48 text-center">
                                            <p class="text-[10px] font-bold uppercase mb-12">Direktur RSIA IBI,</p>
                                            <div class="border-t border-black pt-1">
                                                <p class="text-[10px] font-bold">( ........................................ )</p>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </table>
                        
                        ${item.fileData ? `
                        <div class="mt-8 no-print border-t pt-4">
                            <h4 class="text-xs font-bold uppercase mb-2 text-blue-600 flex items-center gap-2"><i data-lucide="paperclip" class="w-4 h-4"></i> Lampiran Terdeteksi</h4>
                            <div class="p-4 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                ${item.fileType?.startsWith('image/') ? 
                                    `<img src="${item.fileData}" class="max-w-full h-auto rounded shadow-sm">` :
                                    `<div class="flex items-center gap-3 p-4 bg-white rounded-lg border">
                                        <i data-lucide="file-text" class="w-10 h-10 text-red-500"></i>
                                        <div>
                                            <p class="font-bold text-sm">Dokumen Terlampir</p>
                                            <a href="${item.fileData}" download="lampiran-${item.no_agenda || 'surat'}" class="text-blue-600 text-xs hover:underline">Download File Lampiran</a>
                                        </div>
                                    </div>`
                                }
                            </div>
                        </div>` : ''}
                    </div>`;
            } else {
                // Tampilan Detail untuk kategori lain
                content.innerHTML = `
                    <div class="p-12 bg-white">
                        <div class="flex justify-between items-start mb-8 border-b-2 border-slate-800 pb-4">
                            <div>
                                <h2 class="text-3xl font-black uppercase text-slate-800">${config[currentTab].title}</h2>
                                <p class="text-slate-500 text-sm font-medium">RSIA IBI Digital Archive</p>
                            </div>
                            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Logo_Ikatan_Bidan_Indonesia.png" class="h-16">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            ${config[currentTab].fields.map(f => `
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${f.label}</label>
                                    <p class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-1">${item[f.name] || '-'}</p>
                                </div>
                            `).join('')}
                        </div>

                        ${item.fileData ? `
                        <div class="mt-12 no-print">
                            <h4 class="text-xs font-bold uppercase mb-4 text-blue-600">File Lampiran</h4>
                            <div class="rounded-2xl overflow-hidden border">
                                ${item.fileType?.startsWith('image/') ? 
                                    `<img src="${item.fileData}" class="w-full h-auto">` :
                                    `<div class="p-8 bg-slate-50 text-center">
                                        <i data-lucide="file-text" class="w-16 h-16 text-slate-300 mx-auto mb-4"></i>
                                        <p class="font-bold mb-4">File PDF/Dokumen</p>
                                        <a href="${item.fileData}" download="arsip-${item.no_sk || item.agenda || 'data'}" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-xl font-bold">Download Dokumen</a>
                                    </div>`
                                }
                            </div>
                        </div>` : ''}
                    </div>`;
            }
            document.getElementById('detail-modal').classList.add('modal-active');
            lucide.createIcons();
        }

        function openModal() {
            const m = document.getElementById('form-modal');
            document.getElementById('modal-title').innerText = 'Tambah ' + config[currentTab].title;
            document.getElementById('form-edit-index').value = '';
            document.getElementById('file-upload').value = '';
            
            document.getElementById('dynamic-form-fields').innerHTML = config[currentTab].fields.map(f => `
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1 tracking-wider">${f.label}</label>
                    ${f.type === 'textarea' ? 
                        `<textarea name="${f.name}" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" rows="3"></textarea>` : 
                        `<input type="${f.type}" name="${f.name}" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">`}
                </div>`).join('');
            document.getElementById('doc-form').reset();
            m.classList.add('modal-active');
        }

        function editData(idx) {
            openModal();
            const item = archiveData[currentTab][idx];
            document.getElementById('modal-title').innerText = 'Edit ' + config[currentTab].title;
            document.getElementById('form-edit-index').value = idx;
            const form = document.getElementById('doc-form');
            config[currentTab].fields.forEach(f => {
                if(form.elements[f.name]) form.elements[f.name].value = item[f.name] || '';
            });
        }

        async function handleSave() {
            const btn = document.getElementById('btn-save');
            const fileInput = document.getElementById('file-upload');
            const editIdx = document.getElementById('form-edit-index').value;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span> Simpan...`;

            try {
                const entry = {
                    timestamp: new Date().toISOString()
                };
                
                const form = document.getElementById('doc-form');
                new FormData(form).forEach((v, k) => entry[k] = v);

                // Handle File Upload
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    if (file.size > 2 * 1024 * 1024) throw new Error("File terlalu besar! Maksimal 2MB.");
                    
                    const base64 = await toBase64(file);
                    entry.fileData = base64;
                    entry.fileType = file.type;
                    entry.fileName = file.name;
                } else if (editIdx !== '' && archiveData[currentTab][editIdx].fileData) {
                    // Simpan file lama jika sedang edit dan tidak ada file baru
                    entry.fileData = archiveData[currentTab][editIdx].fileData;
                    entry.fileType = archiveData[currentTab][editIdx].fileType;
                }

                if (editIdx !== '') {
                    archiveData[currentTab][editIdx] = entry;
                } else {
                    archiveData[currentTab].unshift(entry);
                }
                
                localStorage.setItem('archiveData_rsia_final', JSON.stringify(archiveData));
                closeModal();
                renderTab();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Simpan Data</span>`;
            }
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function deleteData(idx) {
            if(confirm('Hapus data ini secara permanen?')) {
                archiveData[currentTab].splice(idx, 1);
                localStorage.setItem('archiveData_rsia_final', JSON.stringify(archiveData));
                renderTab();
            }
        }

        function closeModal() { document.getElementById('form-modal').classList.remove('modal-active'); }
        function closeDetailModal() { document.getElementById('detail-modal').classList.remove('modal-active'); }
        function viewDetailFromGlobal(c, i) { currentTab = c; renderTab(); viewDetail(i); }
        function filterTable() {
            const val = document.getElementById('table-search').value.toLowerCase();
            document.querySelectorAll('#table-body tr').forEach(r => {
                r.style.display = r.innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        }

        window.onload = init;
    </script>
</body>
</html>
